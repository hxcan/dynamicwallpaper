syntax = "proto3";

package com.xiaoi.shenzhen.ibotex;

option java_multiple_files = true;
option java_package="com.xiaoi.shenzhen.ibotex";
option java_outer_classname="SetAvatarCameraPositionReqProtos";

message SetAvatarCameraPositionReq
{
    int32 x=1; //X坐标。
    int32 y=2; //Y坐标。
    int32 z=3; //Z坐标。
}
