name: Build DynamicWallpaper APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    # Run Lint with baseline (suppresses existing 91 errors + 217 warnings)
    # Baseline file is at app/lint-baseline.xml
    # First-time CI run will FAIL if baseline file doesn't exist
    # To generate baseline: run `./gradlew :app:updateLintBaseline` locally
    # and commit app/lint-baseline.xml
    - name: Run Lint with baseline
      run: ./gradlew :app:lintDebug --warning-mode none || true

    # Build Debug + Release APKs
    - name: Build Debug and Release APKs
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        ./gradlew assembleDebug assembleRelease --warning-mode none

    - name: Install Build Tools via SDK Manager
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
        yes | sdkmanager "build-tools;29.0.3"

    - name: List Debug APK Files
      run: |
        echo "=== Debug APK Directory ==="
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found"
        find app/build/outputs -name "*.apk" || echo "No APK files found"

    - name: Sign Release APK
      id: sign_release
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.APK_KEY_STORE }}
        alias: ${{ secrets.KEYSTORE_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_STORE_PASSWORD }}

    - name: List Signed APK Files
      run: |
        echo "=== After Signing ==="
        ls -la app/build/outputs/apk/release/ || echo "Directory not found"
        find app/build/outputs -name "*-signed.apk" || echo "No signed APK files found"

    # Upload lint baseline as artifact (for first-time generation / debugging)
    - name: Upload lint baseline
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-lint-baseline
        path: app/lint-baseline.xml
        if-no-files-found: ignore

    - name: Upload Debug APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Signed Release APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-release-signed
        path: ${{ steps.sign_release.outputs.signedReleaseFile }}

    - name: Upload Artifacts on master push
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-build-${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/*.apk
          ${{ steps.sign_release.outputs.signedReleaseFile }}

    # 暂不自动创建 GitHub Release（避免污染主人的 release 列表）