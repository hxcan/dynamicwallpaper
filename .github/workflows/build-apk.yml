name: Build DynamicWallpaper APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission to gradlew
      run: chmod +x gradlew

    # Step 1: Generate lint baseline if it doesn't exist
    - name: Generate Lint baseline (if missing)
      run: |
        if [ ! -f app/lint-baseline.xml ]; then
          echo "Baseline file not found, generating..."
          ./gradlew :app:updateLintBaseline --warning-mode none || true
        else
          echo "Baseline file exists, skipping generation"
        fi

    # Step 2: Run lint (uses baseline to suppress existing issues)
    - name: Run Lint with baseline
      run: ./gradlew :app:lintDebug --warning-mode none

    # Step 3: Build Debug + Release APKs
    - name: Build Debug and Release APKs
      run: |
        export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.daemon=false"
        ./gradlew assembleDebug assembleRelease --warning-mode none

    # Step 4: Auto-commit baseline back to repo (only on push to master)
    - name: Auto-commit lint baseline
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        if [ -f app/lint-baseline.xml ]; then
          git config user.name "sisterfuture-bot"
          git config user.email "etakka@gmail.com"
          git add app/lint-baseline.xml
          if git diff --cached --quiet; then
            echo "No baseline changes to commit"
          else
            git commit -m "ci(lint): auto-generated baseline from CI first run"
            git push
          fi
        fi

    - name: Install Build Tools via SDK Manager
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin
        yes | sdkmanager "build-tools;29.0.3"

    - name: List Debug APK Files
      run: |
        echo "=== Debug APK Directory ==="
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found"
        find app/build/outputs -name "*.apk" || echo "No APK files found"

    # Step 5: Sign Release APK
    # Uses pre-existing secrets (configured 2026-07-24 by owner):
    #   - KEY_STORE_CONTENT_BASE64: keystore file as base64
    #   - KEYSTORE_ALIAS: keystore alias
    #   - KEYSTORE_SECRET: keystore password
    - name: Sign Release APK
      id: sign_release
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEY_STORE_CONTENT_BASE64 }}
        alias: ${{ secrets.KEYSTORE_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_SECRET }}
        keyPassword: ${{ secrets.KEYSTORE_SECRET }}

    - name: List Signed APK Files
      run: |
        echo "=== After Signing ==="
        ls -la app/build/outputs/apk/release/ || echo "Directory not found"
        find app/build/outputs -name "*-signed.apk" || echo "No signed APK files found"

    # Upload lint baseline as artifact (priority - even if signing fails)
    - name: Upload lint baseline
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-lint-baseline
        path: app/lint-baseline.xml
        if-no-files-found: ignore

    - name: Upload Debug APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Signed Release APK artifact (PR)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-release-signed
        path: ${{ steps.sign_release.outputs.signedReleaseFile }}

    - name: Upload Artifacts on master push
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: dynamicwallpaper-build-${{ github.run_number }}
        path: |
          app/build/outputs/apk/debug/*.apk
          ${{ steps.sign_release.outputs.signedReleaseFile }}

    # Step 6: Create CI Release on master push (mirrors hxcan/sisterfuture workflow)
    # Adds the auto-generated APK to a GitHub Release so the owner can download
    # signed builds without digging through Actions artifacts.
    # Renames APKs to semantic names (dynamicwallpaper-<variant>-v<V>-<C>-<TS>.apk)
    # matching the format advertised in hxcan/sisterfuture's release body.
    - name: Rename APKs for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      id: rename_apks
      run: |
        set -e
        # Read versionName/versionCode from app/build.gradle (best effort)
        VERSION_NAME=$(grep -oE 'versionName[[:space:]]+"[^"]+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
        VERSION_CODE=$(grep -oE 'versionCode[[:space:]]+[0-9]+' app/build.gradle | head -1 | awk '{print $2}')
        VERSION_NAME=${VERSION_NAME:-0.0.0}
        VERSION_CODE=${VERSION_CODE:-0}
        BUILD_TS=$(date -u +%Y%m%d-%H%M)
        echo "Detected: versionName=${VERSION_NAME} versionCode=${VERSION_CODE} buildTs=${BUILD_TS}"

        DEBUG_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
        DEBUG_DST="dynamicwallpaper-debug-v${VERSION_NAME}-${VERSION_CODE}-${BUILD_TS}.apk"
        cp "${DEBUG_SRC}" "${DEBUG_DST}"

        RELEASE_SRC="${{ steps.sign_release.outputs.signedReleaseFile }}"
        RELEASE_DST="dynamicwallpaper-release-v${VERSION_NAME}-${VERSION_CODE}-${BUILD_TS}-signed.apk"
        cp "${RELEASE_SRC}" "${RELEASE_DST}"

        echo "debug_artifact=${DEBUG_DST}" >> "$GITHUB_OUTPUT"
        echo "release_artifact=${RELEASE_DST}" >> "$GITHUB_OUTPUT"
        ls -la dynamicwallpaper-*.apk

    - name: Create CI Release (master push)
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ci/auto-build-${{ github.run_number }}
        name: 🤖 CI Build #${{ github.run_number }}
        files: |
          ${{ steps.rename_apks.outputs.debug_artifact }}
          ${{ steps.rename_apks.outputs.release_artifact }}
        prerelease: true
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
          ## 🤖 自动构建版本

          **构建编号:** ${{ github.run_number }}
          **提交:** ${{ github.sha }}
          **时间:** ${{ github.event.head_commit.timestamp }}

          ---
          ### 📦 下载
          - **Debug 版**: `dynamicwallpaper-debug-v*.apk` (自动签名，仅供测试)
            - 文件名格式：`dynamicwallpaper-debug-v{versionName}-{versionCode}-{buildTime}.apk`
          - **Release 版**: `dynamicwallpaper-release-v*-signed.apk` (正式签名，可覆盖安装)
            - 文件名格式：`dynamicwallpaper-release-v{versionName}-{versionCode}-{buildTime}-signed.apk`

          ⚠️ Release 版本使用正式证书签名，支持覆盖安装和正式分发。

          ### 🔗 下载方式
          点击上方的文件即可下载，**无需登录**。
